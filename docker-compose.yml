services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongodb:27017/dental_saas_dev
    depends_on:
      mongodb:
        condition: service_healthy
    command: npm run dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - backend-node-modules:/app/node_modules

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
  backend-node-modules:
